<!doctype html>
<html lang="ru">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Woundbound</title><link rel="stylesheet" href="/src/ui/style.css" /></head>
  <body><div id="game" aria-hidden="true"></div><div id="game-ui"><p>Загрузка игры…</p></div><script>
    const showGameLoadError = () => {
      const root = document.getElementById('game-ui');
      if (!root || root.dataset.ready === 'true') return;
      const message = document.createElement('p');
      message.textContent = 'Не удалось загрузить игру. Обновите страницу и попробуйте снова.';
      const retry = document.createElement('button');
      retry.textContent = 'Обновить страницу';
      retry.addEventListener('click', () => location.reload());
      root.replaceChildren(message, retry);
    };
    document.addEventListener('error', showGameLoadError, { capture: true, once: true });
    window.addEventListener('error', showGameLoadError, { once: true });
    window.addEventListener('unhandledrejection', showGameLoadError, { once: true });
  </script><script type="module" src="/src/main.ts"></script></body>
</html>
